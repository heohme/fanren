name: Discover & Classify Creations

on:
  schedule:
    - cron: "40 2 * * 1,4"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/discover-creations.mjs"
      - "scripts/creation-taxonomy.mjs"
      - ".github/workflows/discover-creations.yml"

permissions:
  contents: write

concurrency:
  group: fetch-snapshot
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discover and classify creations
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_CLASSIFIER_MODEL: doubao-seed-2-0-mini-260428
          REQUIRE_CREATION_MODEL: "1"
          CREATION_SEARCH_PAGES: "2"
        run: node scripts/discover-creations.mjs

      - name: Commit creation index
        run: |
          git config user.name "fanren-bot"
          git config user.email "fanren-bot@users.noreply.github.com"
          git add data/creations.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh creation index $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
